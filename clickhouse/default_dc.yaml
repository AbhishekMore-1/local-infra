name: clickhouse
services:
  app-1:
    image: clickhouse/clickhouse-server:26.3-alpine
    volumes:
      - ./clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse-conf.d:/etc/clickhouse-server/conf.d
      - ./clickhouse-users.d:/etc/clickhouse-server/users.d
    container_name: clickhouse-26-alpine
    ports:
      - "8123:8123"
      - "19000:9000" # host 9000 is held by ZscalerTunnel on 127.0.0.1
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
