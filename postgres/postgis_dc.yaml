name: postgres
services:
  app-1:
    container_name: postgres-17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    # pg_partman + pg_cron + PostGIS. Superset of the pg_partman variant, so it
    # can take over the existing data dir (which preloads pg_cron).
    # own tag: the default (postgres-app-1) is the pg_partman variant's image
    image: postgres-postgis:17-3.5
    build:
      context: .
      dockerfile: postgis.Dockerfile
      secrets:
        - corp_ca
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
secrets:
  corp_ca:
    environment: CORP_CA_PEM
